name: Sync AI agent wrappers

# Le personas operative, ace/prompts/ e scripts/agent-registry.json sono le
# sorgenti di verità. Il generatore comune produce entrambi i lati; i wrapper
# e i file di istruzioni generati non sono trigger di questa action, così il
# commit automatico non crea loop.
on:
  push:
    branches: [master]
    paths:
      - docs/agent-personas/**
      - scripts/agent-registry.json
      - scripts/sync-agent-wrappers.js

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera i wrapper Copilot e Claude
        run: node scripts/sync-agent-wrappers.js --scope all

      - name: Verifica il sync deterministico
        run: node scripts/sync-agent-wrappers.js --scope all --check

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/agents/ .claude/agents/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "chore(agents): sync Copilot e Claude wrappers"
          git push
