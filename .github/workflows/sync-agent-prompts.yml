name: Sync ACE agent wrappers

# ace/prompts/ resta la sorgente di verità separata per gli agenti ACE.
# Il generatore comune istanzia i wrapper minimali per entrambe le piattaforme;
# non è più ammessa una copia letterale del prompt in un wrapper.
on:
  push:
    branches: [master]
    paths:
      - ace/prompts/reflector.md
      - ace/prompts/curator.md
      - ace/prompts/warden.md

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera i wrapper ACE Copilot e Claude
        run: node scripts/sync-agent-wrappers.js --scope ace

      - name: Verifica il sync deterministico
        run: node scripts/sync-agent-wrappers.js --scope all --check

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/agents/ACE-*.agent.md .claude/agents/ace-*.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "chore(agents): sync ACE wrappers da ace/prompts"
          git push
